# unbind default prefix and set it to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# synchronize all panes in a window
bind e set-window-option synchronize-panes

# Reload the tmux config.
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Move around panes with ALT + arrow keys.
bind-key -n M-k select-pane -U
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-l select-pane -R

# Split panes.
# bind-key h split-window -v
# bind-key v split-window -h
set-option -g @ssh-split-h-key "v"
set-option -g @ssh-split-v-key "h"
set-option -g @ssh-split-keep-cwd "true"

# Enable extended keys
set -g extended-keys on

# Shift arrow to switch windows
bind -n M-[ previous-window
bind -n M-] next-window

# Quickly switch windows
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5

# Swap windows with ALT + arrow keys
bind-key -n M-Right swap-window -d -t +1
bind-key -n M-Left swap-window -d -t -1

# List of plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'pschmitt/tmux-ssh-split'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# --- Status Theme settings ---

set -g @plugin '2kabhishek/tmux2k'
# set -g @plugin 'niksingh710/minimal-tmux-status'

# tmux2k settings
set -g @tmux2k-theme 'catppuccin'
set -g @tmux2k-icons-only true
set -g @tmux2k-left-plugins "session git cwd"
set -g @tmux2k-right-plugins "cpu ram battery time"
set -g @tmux2k-enable-popups false
# pi agent status badge (written by ~/.pi/agent/extensions/pi-tmux-status.ts)
# state -> glyph: working=cog U+F085, waiting=hourglass U+F252, done=check U+F00C
set -g @tmux2k-window-list-format '#I:#W #{?@pi_status,#{?#{==:#{@pi_status},waiting},,#{?#{==:#{@pi_status},done},,}},}'
# done clears when the window is selected or a pane is focused; working stays, and
# waiting stays too — a subagent needs an answer, so it must survive a glance.
# pane-focus-in alone is not enough: tmux 3.4 does not fire it on window switches.
set-hook -g pane-focus-in 'if-shell -F "#{==:#{@pi_status},done}" "set-option -uw @pi_status"'
set-hook -g after-select-window 'if-shell -F "#{==:#{@pi_status},done}" "set-option -uw @pi_status"'


# minimal-tmux-status settings
# set -g @minimal-tmux-use-arrow true
# set -g @minimal-tmux-right-arrow ""
# set -g @minimal-tmux-left-arrow ""

#-------------------------------------------------- Status Theme settings end-------------------------------------------------- 

