{
  "service_name": "openviking-server",
  "server": {
    "host": "127.0.0.1",
    "port": 1933,
    "auth_mode": "api_key",
    "root_api_key": "",
    "observability": {
      "metrics": {
        "enabled": false,
        "exporters": {
          "prometheus": {
            "enabled": false
          },
          "otel": {
            "enabled": false
          }
        }
      },
      "traces": {
        "enabled": false
      },
      "logs": {
        "enabled": false
      },
      "dump_body": {
        "enabled": false
      }
    }
  },
  "storage": {
    "workspace": "/home/muzammil/.openviking/data",
    "vectordb": {
      "name": "context",
      "backend": "local"
    },
    "agfs": {
      "backend": "local"
    }
  },
  "embedding": {
    "dense": {
      "provider": "openai",
      "api_base": "http://127.0.0.1:11434/v1",
      "api_key": "ollama",
      "model": "qwen3-embedding:0.6b",
      "dimension": 1024,
      "encoding_format": "float"
    }
  },
  "vlm": {
    "provider": "openai",
    "api_base": "https://opencode.ai/zen/go/v1",
    "api_key": "",
    "model": "glm-5.3-flash",
    "extra_headers": {
      "x-opencode-session": "openviking-muzammil-laptop"
    },
    "max_retries": 3
  },
  "retrieval": {
    "recall_intent_timeout_s": 15.0,
    "recall_rewrite_timeout_s": 60.0
  }
}